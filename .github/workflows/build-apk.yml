name: Build and Release StreApp APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag rilis yang akan dipublikasikan ke Releases (contoh: v1.1.1)"
        required: false
        default: "v1.1.1"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Android SDK & accept licenses
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37" "build-tools;35.0.0" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Determine release tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          TAG_NAME="${{ steps.meta.outputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/StreApp-${TAG_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/StreApp-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreApp-APK
          path: dist/StreApp-*.apk

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: StreApp ${{ steps.meta.outputs.tag }}
          files: |
            dist/StreApp-${{ steps.meta.outputs.tag }}.apk
            dist/StreApp-android.apk
          generate_release_notes: true
